name: GlassVideo
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "16.0"
targets:
  GlassVideo:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: GlassVideo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.glassvideo
        INFOPLIST_FILE: GlassVideo/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: GlassVideo
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
